  function userMenu(anchor, u) {
    $$('.dropdown .menu').forEach((m) => m.remove());
    const self = u.userId === S.user.userId;
    const items = [
      ['reset', 'Reset password'],
      ['logout', 'Force sign-out'],
      u.locked ? ['unlock', 'Unlock account'] : null,
      self ? null : (u.status === 'active' ? ['deactivate', 'Deactivate account'] : ['activate', 'Activate account']),
      self ? null : ['delete', 'Delete account', 'danger']
    ].filter(Boolean);
    const m = document.createElement('div');
    m.className = 'menu';
    m.innerHTML = items.map((i) => '<button data-m="' + i[0] + '"' + (i[2] ? ' class="danger"' : '') + '>' + esc(i[1]) + '</button>').join('');
    anchor.parentNode.appendChild(m);
    const close = (e) => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener('click', close); } };
    setTimeout(() => document.addEventListener('click', close), 0);
    $$('[data-m]', m).forEach((b) => b.addEventListener('click', () => { m.remove(); document.removeEventListener('click', close); userAction(b.getAttribute('data-m'), u); }));
  }

  async function userAction(act, u) {
    const c = $('#content');
    try {
      if (act === 'reset') return resetModal(u);
      if (act === 'logout') {
        if (!(await confirmBox('Force sign-out', 'Sign ' + u.displayName + ' out of every device now?', 'Sign out user'))) return;
        const r = await call('forceLogout', { userId: u.userId });
        if (r.self) { endSession('You signed yourself out.'); return; }
        toast(u.displayName + ' has been signed out everywhere.', 'success');
      } else if (act === 'unlock') {
        await call('unlockUser', { userId: u.userId });
        toast(u.displayName + ' can sign in again.', 'success');
      } else if (act === 'deactivate' || act === 'activate') {
        if (act === 'deactivate' && !(await confirmBox('Deactivate account', u.displayName + ' will be signed out immediately and cannot sign in until re-activated.', 'Deactivate', true))) return;
        await call('setUserStatus', { userId: u.userId, status: act === 'activate' ? 'active' : 'inactive' });
        toast(u.displayName + (act === 'activate' ? ' activated.' : ' deactivated.'), 'success');
      } else if (act === 'delete') {
        if (!(await confirmBox('Delete account', 'Permanently delete @' + u.loginId + '? Their activity history is kept. Consider deactivating instead.', 'Delete account', true))) return;
        await call('deleteUser', { userId: u.userId });
        toast('Account deleted.', 'success');
      }
      await loadUsers(true);
      if (S.route === 'users') drawUsers(c);
    } catch (err) { handleError(err); }
  }

  function spOptions(current) {
    const names = S.admin.salespersons.slice();
    if (current && names.map((n) => n.toUpperCase()).indexOf(current.toUpperCase()) < 0) names.push(current);
    return '<option value="">— Select salesperson —</option>' + names.map((n) => '<option value="' + esc(n) + '"' + (current && n.toUpperCase() === current.toUpperCase() ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '<option value="__other">Other (type a name)…</option>';
  }

  function userModal(u, presetSp) {
    const edit = !!u;
    const p = (u && u.permissions) || { o2d: true, tbo: true, export: true };
    const role = u ? u.role : 'salesperson';
    const sp = u ? u.salesperson : (presetSp || '');
    const suggestedId = presetSp ? presetSp.toLowerCase().split(' ')[0] : '';
    openModal(modalHead(edit ? 'Edit user' : 'Add user', edit ? '@' + u.loginId : 'Create a login and link it to a salesperson.') +
      '<form id="u-form" novalidate><div class="modal-body"><div id="u-alert" class="alert" hidden></div><div class="form-grid">' +
      '<label class="field"><span>Full name</span><input type="text" id="f-name" maxlength="60" value="' + esc(u ? u.displayName : (presetSp ? titleCase(presetSp) : '')) + '"></label>' +
      '<label class="field"><span>Login ID</span><input type="text" id="f-login" maxlength="32" autocapitalize="none" spellcheck="false" value="' + esc(u ? u.loginId : suggestedId) + '"' + (edit ? ' readonly style="background:var(--surface-3)"' : '') + '></label>' +
      '<label class="field"><span>Role</span><select id="f-role">' + [['salesperson', 'Salesperson — own orders only'], ['manager', 'Manager — all data, read-only'], ['admin', 'Administrator — full control']].map((r) => '<option value="' + r[0] + '"' + (role === r[0] ? ' selected' : '') + '>' + r[1] + '</option>').join('') + '</select></label>' +
      '<label class="field" id="f-sp-wrap"><span>Salesperson (column L)</span><select id="f-sp">' + spOptions(sp) + '</select>' +
        '<input type="text" id="f-sp-other" maxlength="60" placeholder="Exact name as in column L" style="margin-top:8px" hidden></label>' +
      (edit ? '' : '<label class="field full"><span>Initial password <span class="hint">— leave blank to generate a strong one</span></span><input type="text" id="f-pw" maxlength="128" autocomplete="new-password" spellcheck="false"></label>') +
      '<div class="field full"><span>Access</span><div class="perm-row">' +
        '<label class="check"><input type="checkbox" id="p-o2d"' + (p.o2d !== false ? ' checked' : '') + '>O2D Orders</label>' +
        '<label class="check"><input type="checkbox" id="p-tbo"' + (p.tbo !== false ? ' checked' : '') + '>To Be Ordered</label>' +
        '<label class="check"><input type="checkbox" id="p-exp"' + (p.export !== false ? ' checked' : '') + '>CSV export</label></div></div>' +
      (edit ? '' : '<label class="check full"><input type="checkbox" id="f-must" checked>Require password change at first sign-in</label>') +
      '</div>' + (edit ? '<p class="tiny muted" style="margin:0">Changing role, salesperson or access signs the user out so the new scope applies immediately.</p>' : '') + '</div>' +
      '<div class="modal-foot"><button type="button" class="btn" data-dismiss>Cancel</button><button type="submit" class="btn btn-primary" id="f-save">' + (edit ? 'Save changes' : 'Create user') + '</button></div></form>', (m) => {
      const roleSel = $('#f-role', m), spSel = $('#f-sp', m), other = $('#f-sp-other', m), wrap = $('#f-sp-wrap', m);
      const syncRole = () => { wrap.style.opacity = roleSel.value === 'salesperson' ? '1' : '.5'; spSel.disabled = roleSel.value !== 'salesperson'; };
      roleSel.addEventListener('change', syncRole); syncRole();
      spSel.addEventListener('change', () => { other.hidden = spSel.value !== '__other'; if (!other.hidden) other.focus(); });
      $('#u-form', m).addEventListener('submit', async (e) => {
        e.preventDefault();
        const al = $('#u-alert', m);
        const r = roleSel.value;
        const spVal = r === 'salesperson' ? (spSel.value === '__other' ? other.value.trim() : spSel.value) : '';
        const payload = {
          displayName: $('#f-name', m).value.trim(), role: r, salesperson: spVal,
          permissions: { o2d: $('#p-o2d', m).checked, tbo: $('#p-tbo', m).checked, export: $('#p-exp', m).checked }
        };
        if (payload.displayName.length < 2) { setAlert(al, 'Enter the user\'s full name.'); return; }
        if (r === 'salesperson' && !spVal) { setAlert(al, 'Select the salesperson this login belongs to.'); return; }
        if (!payload.permissions.o2d && !payload.permissions.tbo) { setAlert(al, 'Grant access to at least one sheet.'); return; }
        if (!edit) {
          payload.loginId = $('#f-login', m).value.trim().toLowerCase();
          payload.password = $('#f-pw', m).value;
          payload.mustChange = $('#f-must', m).checked;
          if (!/^[a-z0-9][a-z0-9._-]{2,31}$/.test(payload.loginId)) { setAlert(al, 'Login ID: 3–32 characters (letters, numbers, dot, dash, underscore).'); return; }
          if (payload.password) { const pp = pwProblem(payload.password); if (pp) { setAlert(al, pp.replace('new password', 'password')); return; } }
        } else payload.userId = u.userId;
        const b = $('#f-save', m); setBusy(b, true, 'Saving…');
        try {
          const res = await call(edit ? 'updateUser' : 'createUser', payload);
          closeModal();
          await loadUsers(true);
          if (S.route === 'users') drawUsers($('#content'));
          if (!edit && res.generatedPassword) credentialsModal('User created', res.user.loginId, res.generatedPassword, res.warning);
          else { toast(edit ? 'Changes saved.' : 'User created.', 'success'); if (res.warning) toast(res.warning); }
        } catch (err) { if (err.code === 'AUTH_REQUIRED') handleError(err); else { setAlert(al, err.error || 'Could not save.'); setBusy(b, false); } }
      });
    });
  }

  function resetModal(u) {
    openModal(modalHead('Reset password', u.displayName + ' (@' + u.loginId + ') will be signed out of all devices.') +
      '<form id="r-form" novalidate><div class="modal-body"><div id="r-alert" class="alert" hidden></div>' +
      '<label class="field"><span>New password <span class="hint">— leave blank to generate one</span></span><input type="text" id="r-pw" maxlength="128" spellcheck="false" autocomplete="new-password"></label>' +
      '<label class="check"><input type="checkbox" id="r-must" checked>Require change at next sign-in</label></div>' +
      '<div class="modal-foot"><button type="button" class="btn" data-dismiss>Cancel</button><button type="submit" class="btn btn-primary" id="r-save">Reset password</button></div></form>', (m) => {
      $('#r-form', m).addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = $('#r-pw', m).value;
        if (pw) { const pp = pwProblem(pw); if (pp) { setAlert($('#r-alert', m), pp.replace('new password', 'password')); return; } }
        const b = $('#r-save', m); setBusy(b, true, 'Resetting…');
        try {
          const res = await call('resetPassword', { userId: u.userId, password: pw, mustChange: $('#r-must', m).checked });
          closeModal();
          if (u.userId === S.user.userId) { endSession('Your password was reset. Please sign in again.'); return; }
          if (res.generatedPassword) credentialsModal('Password reset', u.loginId, res.generatedPassword);
          else toast('Password reset.', 'success');
          await loadUsers(true);
          if (S.route === 'users') drawUsers($('#content'));
        } catch (err) { if (err.code === 'AUTH_REQUIRED') handleError(err); else { setAlert($('#r-alert', m), err.error || 'Could not reset.'); setBusy(b, false); } }
      });
    });
  }

  /* ------------------------------------------------------- admin: activity */
  const EVENT_TONE = {
    LOGIN_SUCCESS: 'good', LOGOUT: 'neutral', LOGIN_FAILED: 'serious', LOGIN_LOCKED: 'critical', LOGIN_BLOCKED: 'critical',
    ACCESS_DENIED: 'critical', DATA_VIEW: 'info', EXPORT: 'violet', PASSWORD_CHANGED: 'aqua', PASSWORD_RESET: 'warn',
    USER_CREATED: 'aqua', USER_UPDATED: 'info', USER_DELETED: 'critical', USER_DEACTIVATED: 'serious', USER_ACTIVATED: 'good',
    FORCE_LOGOUT: 'warn', LOGOUT_ALL: 'warn', CACHE_CLEARED: 'neutral', SYSTEM_SETUP: 'violet', USER_UNLOCKED: 'good', PASSWORD_CHANGE_FAILED: 'serious', ADMIN_RECOVERY: 'critical'
  };

  async function renderActivity(c, force) {
    if (!isAdmin()) { c.innerHTML = emptyState('Not authorised', 'Administrator access is required.'); return; }
    const A = S.admin;
    if (!A.activity || force) {
      if (!A.activity) c.innerHTML = skeleton();
      try { A.activity = (await call('getActivity', { limit: 400, loginId: A.actLogin, event: A.actEvent })).items; }
      catch (err) { handleError(err); return; }
      if (S.route !== 'activity') return;
    }
    const items = A.activity;
    const todayStr = new Date().toDateString();
    const todays = items.filter((i) => new Date(i.timestamp).toDateString() === todayStr);
    const ev = Object.keys(EVENT_TONE).sort();
    c.innerHTML = '<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">' +
      kpiMini('Sign-ins today', todays.filter((i) => i.event === 'LOGIN_SUCCESS').length, 'good', I.check) +
      kpiMini('Failed sign-ins today', todays.filter((i) => /LOGIN_(FAILED|LOCKED|BLOCKED)/.test(i.event)).length, 'warn', I.alert) +
      kpiMini('Access denied today', todays.filter((i) => i.event === 'ACCESS_DENIED').length, 'critical', I.shield) +
      kpiMini('Unique users today', new Set(todays.filter((i) => i.event === 'LOGIN_SUCCESS' || i.event === 'DATA_VIEW').map((i) => i.loginId)).size, 'data', I.users) + '</div>' +
      '<div class="panel"><div class="toolbar"><div class="toolbar-row">' +
      '<input type="text" id="a-login" placeholder="Filter by login ID" value="' + esc(A.actLogin) + '" style="max-width:220px">' +
      '<select id="a-event" style="width:auto"><option value="">All events</option>' + ev.map((e) => '<option' + (A.actEvent === e ? ' selected' : '') + '>' + e + '</option>').join('') + '</select>' +
      '<button class="btn btn-primary" id="a-apply">Apply</button><button class="btn" id="a-clear">Clear</button>' +
      '<span class="result-meta">Latest ' + fmtN(items.length) + ' events</span></div></div>' +
      (items.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>Time</th><th>User</th><th>Event</th><th>Detail</th><th>Result</th></tr></thead><tbody>' +
        items.map((i) => '<tr style="cursor:default"><td><div>' + esc(fmtDateTime(i.timestamp)) + '</div><div class="cell-sub">' + esc(timeAgo(i.timestamp)) + '</div></td>' +
          '<td><div class="cell-strong">' + esc(i.displayName || i.loginId || '—') + '</div><div class="cell-sub">' + (i.loginId ? '@' + esc(i.loginId) : '') + (i.role ? ' · ' + esc(i.role) : '') + '</div></td>' +
          '<td><span class="pill st-' + (EVENT_TONE[i.event] || 'neutral') + '"><span class="dot"></span>' + esc(i.event.replace(/_/g, ' ').toLowerCase()) + '</span></td>' +
          '<td class="cell-max" style="max-width:380px" title="' + esc(i.detail) + '">' + esc(i.detail || '—') + '</td>' +
          '<td>' + (i.result === 'ok' ? '<span class="tag">ok</span>' : '<span class="tag" style="color:var(--critical)">' + esc(i.result) + '</span>') + '</td></tr>').join('') +
        '</tbody></table></div>' : emptyState('No activity found', 'Try clearing the filters.')) + '</div>';
    $('#a-apply', c).addEventListener('click', () => { A.actLogin = $('#a-login', c).value.trim(); A.actEvent = $('#a-event', c).value; renderActivity(c, true); });
    $('#a-login', c).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#a-apply', c).click(); });
    $('#a-clear', c).addEventListener('click', () => { A.actLogin = ''; A.actEvent = ''; renderActivity(c, true); });
  }
  function kpiMini(label, val, tone, icon) {
    return '<div class="kpi tone-' + tone + '"><div class="kpi-label"><span class="kpi-ico">' + icon + '</span>' + esc(label) + '</div><div class="kpi-value num">' + fmtN(val) + '</div></div>';
  }

  /* --------------------------------------------------------- admin: system */
  async function renderSystem(c) {
    if (!isAdmin()) { c.innerHTML = emptyState('Not authorised', 'Administrator access is required.'); return; }
    c.innerHTML = skeleton();
    let sys;
    try { sys = await call('getSystem'); } catch (err) { handleError(err); return; }
    if (S.route !== 'system') return;
    const P = sys.policy;
    c.innerHTML = '<div class="grid-2-even">' +
      '<div class="panel"><div class="panel-head"><div><h3>Data sources</h3><div class="sub">Read-only connection to the FMS spreadsheet</div></div></div><div class="panel-body"><dl class="kv">' +
        sys.sources.map((s) => '<dt>' + esc(s.label) + '</dt><dd>Sheet <b>' + esc(s.sheet) + '</b> · rows from ' + esc(s.firstDataRow) + ' · columns A–O + ' + (s.key === 'o2d' ? 'CN' : 'CE') + ' · salesperson = column L</dd>').join('') +
        '<dt>FMS spreadsheet</dt><dd><a href="' + esc(safeUrl(sys.fmsSheetUrl)) + '" target="_blank" rel="noopener noreferrer">Open FMS sheet ↗</a></dd>' +
        '<dt>Auth database (private)</dt><dd><a href="' + esc(safeUrl(sys.authDbUrl)) + '" target="_blank" rel="noopener noreferrer">Open Auth DB ↗</a><div class="tiny muted">Never share this file. Hashes are useless without the server-side secret.</div></dd>' +
        '<dt>Time zone</dt><dd>' + esc(sys.timeZone) + '</dd>' +
        '<dt>Data cache</dt><dd>' + P.dataCacheSeconds + ' s server cache · clients auto-sync every ' + Math.round(P.clientSyncSeconds / 60) + ' min</dd></dl></div></div>' +
      '<div class="panel"><div class="panel-head"><div><h3>Security policy</h3><div class="sub">Enforced on the server for every request</div></div></div><div class="panel-body"><dl class="kv">' +
        '<dt>Session idle timeout</dt><dd>' + P.sessionIdleMinutes + ' minutes</dd>' +
        '<dt>Maximum session length</dt><dd>' + P.sessionMaxHours + ' hours</dd>' +
        '<dt>Brute-force lockout</dt><dd>' + P.maxFailedAttempts + ' failed attempts → locked ' + P.lockoutMinutes + ' min</dd>' +
        '<dt>Password policy</dt><dd>Min ' + P.passwordMinLength + ' characters, letter + number; salted & peppered HMAC-SHA256</dd>' +
        '<dt>Data isolation</dt><dd>Salesperson rows filtered server-side by column L before sending</dd>' +
        '<dt>Accounts</dt><dd>' + sys.counts.users + ' total · ' + sys.counts.active + ' active · ' + sys.counts.admins + ' admin(s)</dd></dl></div></div></div>' +
      '<div class="panel"><div class="panel-head"><div><h3>Maintenance</h3><div class="sub">Use when something looks out of date or a security incident is suspected</div></div></div><div class="panel-body" style="display:flex;gap:12px;flex-wrap:wrap">' +
        '<button class="btn" id="s-cache">' + I.activity + 'Force data re-sync</button>' +
        '<button class="btn btn-danger" id="s-all">' + I.shield + 'Sign out all users</button></div></div>';
    $('#s-cache', c).addEventListener('click', async (e) => {
      const b = e.currentTarget; setBusy(b, true, 'Clearing…');
      try { await call('clearCache'); S.version = null; await syncNow(true); toast('Cache cleared and data re-synced.', 'success'); } catch (err) { handleError(err); }
      setBusy(b, false);
    });
    $('#s-all', c).addEventListener('click', async () => {
      if (!(await confirmBox('Sign out all users', 'Every active session — including yours — will be ended immediately.', 'Sign out everyone', true))) return;
      try { await call('logoutAll'); endSession('All sessions were signed out. Please sign in again.'); } catch (err) { handleError(err); }
    });
  }

  /* ----------------------------------------------------------------- theme */
  function applyTheme(t) { if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next); pref.set('fms.theme', next);
  }

  /* ------------------------------------------------------------------ init */
  function initShell() {
    $('#menu-btn').addEventListener('click', () => $('#view-app').classList.add('nav-open'));
    $('#scrim').addEventListener('click', () => $('#view-app').classList.remove('nav-open'));
    $('#refresh-btn').addEventListener('click', () => syncNow(false));
    const ub = $('#user-btn'), um = $('#user-menu');
    ub.addEventListener('click', (e) => { e.stopPropagation(); um.hidden = !um.hidden; ub.setAttribute('aria-expanded', String(!um.hidden)); });
    document.addEventListener('click', (e) => { if (!um.hidden && !um.contains(e.target)) { um.hidden = true; ub.setAttribute('aria-expanded', 'false'); } });
    document.addEventListener('click', (e) => {
      const a = e.target.closest('[data-action]');
      if (!a) return;
      um.hidden = true;
      const act = a.getAttribute('data-action');
      if (act === 'logout') logout();
      else if (act === 'change-password') changePasswordModal();
      else if (act === 'toggle-theme') toggleTheme();
    });
    // Nav items have no href at all: inside the Apps Script sandbox iframe any
    // link navigation would replace the whole page. Routing is purely in-memory.
    const navGo = (e) => {
      const a = e.target.closest('[data-route]');
      if (!a) return;
      e.preventDefault();
      e.stopPropagation();
      go(a.getAttribute('data-route'));
    };
    $('#nav').addEventListener('click', navGo, true);
    $('#nav').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') navGo(e); }, true);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { if (!$('#modal-host').hidden) closeModal(); else if (!$('#drawer-host').hidden) closeDrawer(); }
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && S.user && Date.now() - S.lastSync > S.settings.syncSeconds * 1000) syncNow(false);
    });
  }

  async function boot() {
    applyTheme(pref.get('fms.theme'));
    initTooltip(); initAuth(); initShell();
    const t = store.get(TOKEN_KEY);
    if (!t) { showView('login'); return; }
    S.token = t;
    try {
      const res = await call('me');
      S.user = res.user; S.settings = Object.assign(S.settings, res.settings || {});
      if (S.user.mustChange) showView('change'); else enterApp();
    } catch (err) {
      store.del(TOKEN_KEY); S.token = null;
      showView('login');
      if (err && err.code !== 'AUTH_REQUIRED') setAlert($('#login-alert'), err.error || 'Could not reach the server.');
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
